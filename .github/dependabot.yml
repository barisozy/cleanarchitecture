version: 2

updates:
  # One grouped pull request per ecosystem and week. A single maintainer does not need a separate
  # review thread for every dependency.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
