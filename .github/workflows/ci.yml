name: CI

on:
  push:
    # Templates are copied under either name; both default branches run the pipeline.
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Format, unit, slice, architecture and core coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify formatting and run checks
        run: ./gradlew spotlessCheck check --console=plain

      - name: Build the executable jar
        run: ./gradlew bootJar --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/**
          retention-days: 14

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: build/reports/jacoco/**
          retention-days: 14

      - name: Upload the application jar
        uses: actions/upload-artifact@v7
        with:
          name: application-jar
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
            !build/libs/*-test-fixtures.jar
          if-no-files-found: error
          retention-days: 14

  integration:
    name: Integration tests
    # The integration suite needs Docker, so it runs on its own runner. The build job runs first:
    # a broken build does not have to pay for a container.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A reused container would carry state between runs; CI always starts from a clean database.
      TESTCONTAINERS_REUSE_ENABLE: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run the integration tests
        run: ./gradlew integrationTest --console=plain

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: build/reports/tests/**
          retention-days: 14
